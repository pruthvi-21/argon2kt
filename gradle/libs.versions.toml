androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }
androidx-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }

androidx-ui = { module = "androidx.compose.ui:ui" }
google-truth = { module = "com.google.truth:truth", version.ref = "truth" }
junit = { module = "junit:junit", version.ref = "junit" }
roboeletric = { module = "org.robolectric:robolectric", version.ref = "roboeletric" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }